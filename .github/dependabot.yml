version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      deps:
        applies-to: "version-updates"
        update-types: ["minor", "patch"]
        exclude-patterns: ["fumadocs*"]
      fumadocs:
        patterns: ["fumadocs*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
