name: Feature request
description: Suggest a new component, state, or improvement.
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: Read [docs/purpose.md](https://github.com/isthatpratik/calmponent/blob/main/docs/purpose.md) first. Calmponent is not an effects library.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem do you have today? Describe the problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What do you suggest? Include states and motion if they apply.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What other solutions did you consider?
